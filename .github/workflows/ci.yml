name: Athena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-deletion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: athena
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: athena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://athena:local-ci-only@127.0.0.1:5432/athena_test
      DIRECT_URL: postgresql://athena:local-ci-only@127.0.0.1:5432/athena_test
      ATHENA_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm run db:generate && npm run db:migrate
        working-directory: backend
      - run: node --test integration/student_deletion.postgres.test.js
        working-directory: backend

  test-and-build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build:frontend

      - name: Run full test suite
        run: npm test

      - name: Package macOS app (smoke check)
        run: npm run dist:mac:demo

      - name: Verify app signature and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Athena.app
          hdiutil verify release/*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-macos-dmg
          path: release/*.dmg
          if-no-files-found: error
